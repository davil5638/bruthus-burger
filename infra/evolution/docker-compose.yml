# ──────────────────────────────────────────────
# Evolution API — ponte entre o sistema e o WhatsApp
#
# Roda na VM do Oracle (ARM, Ubuntu 24.04), NÃO no Render. No plano free
# do Render o serviço dorme quando fica ocioso, e quando dorme a sessão do
# WhatsApp cai — seria reconectar QR todo dia. O disco de lá também é
# descartado a cada restart, e é nele que a sessão vive.
#
# ATENÇÃO À IMAGEM: a partir da v2.3.0 o projeto mudou de
# `atendai/evolution-api` para `evoapicloud/evolution-api`. A maioria dos
# tutoriais na internet ainda aponta para o nome antigo e trava numa
# versão velha. Esta imagem tem build arm64, que é o necessário na
# Ampere A1 do Oracle — a maioria das imagens de WhatsApp não tem.
#
# POR QUE O CADDY:
# A Evolution NÃO fica exposta na internet. Só o Caddy escuta 80/443, e
# ele resolve o certificado HTTPS sozinho com o Let's Encrypt. Sem isso a
# apikey viajaria em texto puro entre o Render e esta máquina.
#
# Como usar:
#   docker compose up -d
#   docker compose logs -f evolution
# ──────────────────────────────────────────────

services:
  caddy:
    image: caddy:2
    container_name: evolution-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - evolution

  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: evolution
    restart: unless-stopped
    # Só o localhost da própria VM alcança a 8080 direto. Quem vem de fora
    # passa obrigatoriamente pelo Caddy, com HTTPS.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Endereço público. Precisa bater com o domínio real, senão o QR
      # code e os webhooks apontam para o lugar errado.
      SERVER_URL: https://${DOMINIO}

      # A chave que o seu sistema manda no header `apikey`. É esta que vai
      # em EVOLUTION_API_KEY no Render.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: bruthus

      # Cache local basta para uma instância só. Redis é para quem roda
      # muitos números em paralelo.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # Sem isso o container enche o disco da VM com log em poucas semanas.
      LOG_LEVEL: ERROR
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances

  # ── Atendente: o bot de WhatsApp ──
  # Sem `ports`: ninguém da internet alcança. Só a Evolution chama, pela
  # rede interna do Docker, em http://bot:3000. Um bot de atendimento
  # exposto é convite para alguém disparar mensagem no nome da loja.
  #
  # Começa em OBSERVAÇÃO: entende tudo e grava, não responde ninguém.
  # Para soltar, BOT_RESPONDER=1 no .env e `docker compose up -d`.
  bot:
    image: node:20-alpine
    container_name: atendente
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --omit=dev --no-audit --no-fund --loglevel=error && node index.js"
    environment:
      PORTA: 3000
      RESPONDER: ${BOT_RESPONDER:-0}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: bruthus
      OLACLICK_API_TOKEN: ${OLACLICK_API_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # A chave do Pix vive só aqui, no .env da VM — nunca no git.
      PIX_CHAVE: ${PIX_CHAVE}
      PIX_NOME: ${PIX_NOME}
      ORDER_LINK: ${ORDER_LINK}
      # Para onde vai o aviso quando o bot encosta no limite: o WhatsApp
      # da própria loja. ALERTAR_DONO=0 desliga.
      ALERTA_NUMERO: ${ALERTA_NUMERO}
      ALERTAR_DONO: ${ALERTAR_DONO:-1}
      # Vai no fim da URL do webhook do OlaClick. Sem ele o endpoint
      # responde 200 e não faz nada — um webhook aberto deixaria qualquer
      # um disparar mensagem em nome da loja.
      HOOK_SEGREDO: ${HOOK_SEGREDO}
      # Segundo canal de aviso. O WhatsApp da loja sozinho se perde no
      # meio das conversas de cliente; no Telegram so tem ele.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DIARIO: /dados/observacao.jsonl
      TZ: America/Fortaleza
    volumes:
      - /home/ubuntu/bot:/app
      - bot_dados:/dados
    depends_on:
      - evolution

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
  evolution_pgdata:
  caddy_data:
  caddy_config:
  bot_dados:
