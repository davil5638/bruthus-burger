# ──────────────────────────────────────────────
# Evolution API — ponte entre o sistema e o WhatsApp
#
# Roda numa VPS, NÃO no Render. No plano free do Render o serviço dorme
# quando fica ocioso, e quando dorme a sessão do WhatsApp cai — seria
# reconectar QR todo dia. O disco de lá também é descartado a cada
# restart, e é nele que a sessão vive.
#
# Requisitos: VPS com 1 GB de RAM (2 GB folgado), Docker e Docker Compose.
#
# ATENÇÃO À IMAGEM: a partir da v2.3.0 o projeto mudou de
# `atendai/evolution-api` para `evoapicloud/evolution-api`. A maioria dos
# tutoriais na internet ainda aponta para o nome antigo e trava numa
# versão velha. Confirme a tag atual em doc.evolution-api.com antes de
# subir — os nomes das variáveis também mudam entre versões menores.
#
# Como usar:
#   1. copie .env.exemplo para .env e preencha
#   2. docker compose up -d
#   3. docker compose logs -f evolution   (confirme que subiu)
#   4. crie a instância e pareie o QR (ver README.md)
# ──────────────────────────────────────────────

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Endereço público. Precisa bater com o domínio/IP que você vai usar,
      # senão o QR code e os webhooks apontam para o lugar errado.
      SERVER_URL: ${SERVER_URL}

      # A chave que o seu sistema manda no header `apikey`. É esta que vai
      # em EVOLUTION_API_KEY no Render.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: bruthus

      # Cache local basta para uma instância só. Redis é para quem roda
      # muitos números em paralelo.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # Sem isso o container enche o disco da VPS com log em poucas semanas.
      LOG_LEVEL: ERROR
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
  evolution_pgdata:
